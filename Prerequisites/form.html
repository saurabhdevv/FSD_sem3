<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<link rel="stylesheet" href="form.css">
</head>
<body>
<h1>Registration Form</h1>

<form>
<div>
<label>First Name:</label><input type="text" required>
<label>Last Name:</label><input type="text" required>
<label>Father's Name:</label><input type="text" required>
<label>Mother's Name:</label><input type="text" required>

<input type="radio" name="g" required> Male

</div>

<p><input type="submit" value="Submit Form">
<input type="reset" value="Clear Form"></p>
</form>
</body>
</html>
